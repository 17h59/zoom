[project]
name = "zoombots"
version = "0.1.0"
description = "Bots Zoom pilotables (client web headless) avec soundboard"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zoombots"]

[tool.setuptools.package-data]
zoombots = ["static/*"]
