[project]
name = "zoombots"
version = "0.1.0"
description = "Bots Zoom pilotables (client web headless) avec soundboard"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "fastapi>=0.110", "starlette>=1.3", "uvicorn[standard]>=0.29", "yt-dlp>=2024.8.1"]

[project.scripts]
zoombots = "zoombots.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zoombots"]

[tool.setuptools.package-data]
zoombots = ["static/*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
